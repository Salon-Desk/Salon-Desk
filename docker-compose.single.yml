# Single-container stack (matches VPS production image)
# Usage: docker compose -f docker-compose.single.yml up --build

services:
  salondesk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salondesk
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-salondesk}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@127.0.0.1:5432/${POSTGRES_DB:-salondesk}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - salondesk_pgdata:/var/lib/postgresql/data

volumes:
  salondesk_pgdata:
