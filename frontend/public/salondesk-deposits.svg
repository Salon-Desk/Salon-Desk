<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <!-- Background glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <!-- Calendar gradient -->
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Calendar Header gradient -->
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Lock Shackle gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Scissors Blue Gradient -->
    <linearGradient id="scissorBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="80%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="scissorHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Gold Text 3D Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="navyText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="goldBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background glow behind motif -->
  <circle cx="180" cy="240" r="180" fill="url(#goldGlow)"/>

  <!-- MOTIF GROUP -->
  <g id="logo-icon" transform="translate(40, 50)" filter="url(#softShadow)">
    
    <!-- Lock Shackle Arch -->
    <path d="M 100 150 C 100 60, 200 60, 200 150 L 200 180 L 172 180 L 172 150 C 172 90, 128 90, 128 150 L 128 180 L 100 180 Z" 
          fill="url(#shackleGrad)" stroke="#B45309" stroke-width="2"/>
    <ellipse cx="150" cy="85" rx="36" ry="12" fill="#FEF08A" opacity="0.6"/>

    <!-- Calendar Pad Body -->
    <rect x="40" y="150" width="220" height="190" rx="24" fill="url(#calGrad)" stroke="#FBBF24" stroke-width="3"/>
    
    <!-- Calendar Top Binding Ring Tabs -->
    <rect x="75" y="136" width="16" height="24" rx="6" fill="#78350F"/>
    <rect x="209" y="136" width="16" height="24" rx="6" fill="#78350F"/>
    
    <!-- Calendar Pad Top Header Banner -->
    <rect x="42" y="152" width="216" height="42" rx="20" fill="url(#calHeader)"/>
    <line x1="42" y1="194" x2="258" y2="194" stroke="#78350F" stroke-width="2" opacity="0.4"/>

    <!-- Calendar Grid Slots -->
    <g fill="#9A3412" opacity="0.85">
      <!-- Row 1 -->
      <rect x="62" y="210" width="38" height="34" rx="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
      <rect x="110" y="210" width="38" height="34" rx="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
      <rect x="158" y="210" width="38" height="34" rx="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
      <rect x="206" y="210" width="34" height="34" rx="8" fill="#FEF08A" stroke="#F59E0B" stroke-width="2" filter="url(#goldBloom)"/>

      <!-- Row 2 -->
      <rect x="62" y="254" width="38" height="34" rx="8" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
      <rect x="110" y="254" width="38" height="34" rx="8" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
      <rect x="158" y="254" width="38" height="34" rx="8" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
      <rect x="206" y="254" width="34" height="34" rx="8" fill="#EA580C" stroke="#9A3412" stroke-width="1.5"/>

      <!-- Row 3 -->
      <rect x="62" y="296" width="38" height="30" rx="8" fill="#B45309"/>
      <rect x="110" y="296" width="38" height="30" rx="8" fill="#B45309"/>
      <rect x="158" y="296" width="38" height="30" rx="8" fill="#B45309"/>
      <rect x="206" y="296" width="34" height="30" rx="8" fill="#B45309"/>
    </g>

    <!-- OVERLAID INTERSECTING STYLING SHEARS (SCISSORS) -->
    <!-- Blade 1 (Left handle to Top Right tip) -->
    <g transform="translate(150, 240) rotate(-32) translate(-150, -240)">
      <!-- Blade -->
      <path d="M 144 240 L 146 60 Q 150 48 154 60 L 156 240 Z" fill="url(#scissorHighlight)"/>
      <path d="M 148 240 L 150 56 L 152 240 Z" fill="#93C5FD"/>
      <!-- Handle shank -->
      <path d="M 145 240 L 142 330 Q 140 350 120 360 Q 90 370 85 340 Q 80 310 115 305 Q 135 305 142 280 Z" 
            fill="url(#scissorBlue)" stroke="#38BDF8" stroke-width="2.5"/>
      <!-- Finger Ring Hole -->
      <ellipse cx="106" cy="336" rx="18" ry="22" fill="#090D16" stroke="#60A5FA" stroke-width="2"/>
    </g>

    <!-- Blade 2 (Right handle to Top Left tip) -->
    <g transform="translate(150, 240) rotate(32) translate(-150, -240)">
      <!-- Blade -->
      <path d="M 144 240 L 146 60 Q 150 48 154 60 L 156 240 Z" fill="url(#scissorHighlight)"/>
      <path d="M 148 240 L 150 56 L 152 240 Z" fill="#BFDBFE"/>
      <!-- Handle shank with pinky finger rest spur -->
      <path d="M 155 240 L 158 330 Q 160 350 180 360 Q 210 370 215 340 Q 220 310 185 305 Q 165 305 158 280 Z" 
            fill="url(#scissorBlue)" stroke="#38BDF8" stroke-width="2.5"/>
      <!-- Pinky rest curved spur -->
      <path d="M 205 355 Q 225 365 235 385 Q 220 380 210 365 Z" fill="#2563EB"/>
      <!-- Finger Ring Hole -->
      <ellipse cx="194" cy="336" rx="18" ry="22" fill="#090D16" stroke="#60A5FA" stroke-width="2"/>
    </g>

    <!-- Central Pivot Rivet / Screw (Gold Gem) -->
    <circle cx="150" cy="240" r="12" fill="url(#calGrad)" stroke="#FEF08A" stroke-width="3" filter="url(#goldBloom)"/>
    <circle cx="150" cy="240" r="5" fill="#78350F"/>

    <!-- Sparkling Golden 4-point Diamond Stars -->
    <!-- Star Top Left -->
    <g transform="translate(60, 95)" filter="url(#goldBloom)">
      <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="#FEF08A"/>
    </g>
    <!-- Star Top Right -->
    <g transform="translate(235, 95)" filter="url(#goldBloom)">
      <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#FBBF24"/>
    </g>
    <!-- Star Lower Bottom Center -->
    <g transform="translate(150, 395)" filter="url(#goldBloom)">
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#FEF08A"/>
    </g>
    <!-- Small accent sparkle -->
    <g transform="translate(175, 415)">
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#F59E0B"/>
    </g>
  </g>

  <!-- TYPOGRAPHY / WORDMARK -->
  <g id="brand-typography" transform="translate(320, 215)">
    <!-- "SalonDesk" in Bold Display -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1px"
          fill="#38BDF8"
          stroke="#0F172A"
          stroke-width="8"
          stroke-linejoin="round"
          filter="url(#softShadow)">
      SalonDesk
    </text>
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1px"
          fill="#F8FAFC">
      Salon<tspan fill="#38BDF8">Desk</tspan>
    </text>

    <!-- "DEPOSITS" in chiseled imperial gold -->
    <text x="5" y="85" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="12px"
          fill="#78350F"
          stroke="#451A03"
          stroke-width="6"
          stroke-linejoin="round">
      DEPOSITS
    </text>
    <text x="5" y="85" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="12px"
          fill="url(#goldText)"
          filter="url(#goldBloom)">
      DEPOSITS
    </text>

    <!-- Subtitle tagline under brand in SVG -->
    <text x="8" y="128" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="18" 
          font-weight="600" 
          letter-spacing="2.5px"
          fill="#94A3B8">
      A HOLD, NOT A CHARGE · PAYPAL AUTHORIZATION HOLDS
    </text>
  </g>
</svg>
