[project]
name = "salon-desk-backend"
version = "0.1.0"
description = "Salon Desk API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "bcrypt>=5.0.0",
    "pgvector>=0.3.6",
    "livekit>=1.0.0",
    "livekit-agents[openai,silero,deepgram]>=1.0.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "aiosmtplib>=5.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # FastAPI Depends/Query in defaults is intentional
    "UP042", # keep str, Enum for SQLAlchemy / Pydantic compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
