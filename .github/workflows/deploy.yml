name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://paypalai.hackathon.huludelala.com' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://paypalai.hackathon.huludelala.com' }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ vars.NEXT_PUBLIC_LIVEKIT_URL || '' }}
            NEXT_PUBLIC_ENABLE_AGENT_CHAT=true
            NEXT_PUBLIC_ENABLE_VOICE_AGENT=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Set image ref
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          CONTAINER_NAME: salondesk
          # Host port for the all-in-one image. Default 8080 — VPS nginx already owns :80/:443.
          # Override with repo variable VPS_APP_PORT if needed.
          APP_PORT: ${{ vars.VPS_APP_PORT || '8080' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # Connection timeout (seconds). i/o timeout usually means firewall / wrong host/port.
          timeout: 60s
          command_timeout: 30m
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,CONTAINER_NAME,APP_PORT
          script: |
            set -euo pipefail
            PUBLISH_PORT="${APP_PORT:-8080}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            # Free the publish port by stopping our previous container first.
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true
            if ss -tln | grep -qE ":${PUBLISH_PORT}\\b"; then
              echo "ERROR: host port ${PUBLISH_PORT} is still in use by another process. Set GitHub variable VPS_APP_PORT to a free port."
              ss -tlnp | grep -E ":${PUBLISH_PORT}\\b" || true
              exit 1
            fi
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "127.0.0.1:${PUBLISH_PORT}:80" \
              -v salondesk_pgdata:/var/lib/postgresql/data \
              --env-file /opt/salondesk/.env \
              "$IMAGE"
            for i in $(seq 1 36); do
              if curl -sf "http://127.0.0.1:${PUBLISH_PORT}/health" >/dev/null; then
                echo "SalonDesk healthy on 127.0.0.1:${PUBLISH_PORT}"
                docker image prune -f
                exit 0
              fi
              sleep 5
            done
            echo "Deployed container failed health check"
            docker logs "$CONTAINER_NAME" --tail 120 || true
            exit 1
