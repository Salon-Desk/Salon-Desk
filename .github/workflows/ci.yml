name: CI

on:
  pull_request:
  push:
    branches: [main, dev-fix]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: salondesk_test
          POSTGRES_USER: salondesk
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --group dev

      - name: Run Ruff checks & format
        run: |
          cd backend
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://salondesk:password@localhost:5432/salondesk_test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
        run: |
          cd backend
          uv run pytest -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Frontend Format Check
        run: |
          cd frontend
          pnpm format

      - name: Frontend Typecheck
        run: |
          cd frontend
          pnpm typecheck

      - name: Frontend Lint
        run: |
          cd frontend
          pnpm lint

  build-single-image:
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: salondesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name salondesk-ci \
            -e POSTGRES_PASSWORD=ci-test \
            -e SKIP_SEED=1 \
            -e CORS_ORIGINS='["http://localhost"]' \
            -p 8080:80 \
            salondesk:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/sd-health.json -w "%{http_code}" http://127.0.0.1:8080/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "Health check passed (HTTP $code)"
              cat /tmp/sd-health.json || true
              docker logs salondesk-ci --tail 80
              exit 0
            fi
            echo "attempt $i/60: /health -> HTTP ${code}"
            sleep 5
          done
          echo "Health check failed"
          docker logs salondesk-ci
          docker exec salondesk-ci sh -c 'ss -tlnp; curl -sv http://127.0.0.1:8000/health; curl -sv http://127.0.0.1/health' || true
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f salondesk-ci 2>/dev/null || true
