name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-single-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: salondesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name salondesk-ci \
            -e POSTGRES_PASSWORD=ci-test \
            -e SKIP_SEED=1 \
            -e CORS_ORIGINS='["http://localhost"]' \
            -p 8080:80 \
            salondesk:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/sd-health.json -w "%{http_code}" http://127.0.0.1:8080/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "Health check passed (HTTP $code)"
              cat /tmp/sd-health.json || true
              docker logs salondesk-ci --tail 80
              exit 0
            fi
            echo "attempt $i/60: /health -> HTTP ${code}"
            sleep 5
          done
          echo "Health check failed"
          docker logs salondesk-ci
          docker exec salondesk-ci sh -c 'ss -tlnp; curl -sv http://127.0.0.1:8000/health; curl -sv http://127.0.0.1/health' || true
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f salondesk-ci 2>/dev/null || true
