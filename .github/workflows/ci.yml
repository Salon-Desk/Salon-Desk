name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-single-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: salondesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name salondesk-ci \
            -e POSTGRES_PASSWORD=ci-test \
            -e CORS_ORIGINS='["http://localhost"]' \
            -p 8080:80 \
            salondesk:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "Health check passed"
              docker logs salondesk-ci --tail 50
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          docker logs salondesk-ci
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f salondesk-ci 2>/dev/null || true
